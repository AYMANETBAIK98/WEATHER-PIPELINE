# Local stack:
#   warehouse   - PostgreSQL where the weather data lands  (localhost:5433)
#   airflow-db  - PostgreSQL for Airflow's own metadata
#   airflow     - Airflow 3 (scheduler + API server + UI)   (http://localhost:8080)
services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB:-weather}
      POSTGRES_USER: ${WAREHOUSE_USER:-etl}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-etl}
    ports:
      - "5433:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-etl} -d ${WAREHOUSE_DB:-weather}"]
      interval: 5s
      retries: 10

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 10

  airflow:
    build: .
    command: airflow standalone
    depends_on:
      warehouse:
        condition: service_healthy
      airflow-db:
        condition: service_healthy
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      # local demo only: skip the login screen. Never do this in production.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: 5432
      WAREHOUSE_DB: ${WAREHOUSE_DB:-weather}
      WAREHOUSE_USER: ${WAREHOUSE_USER:-etl}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-etl}
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./sql:/opt/airflow/sql

volumes:
  warehouse-data:
  airflow-db-data:
