name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: weather
          POSTGRES_USER: etl
          POSTGRES_PASSWORD: etl
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etl -d weather"
          --health-interval 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit + integration tests
        env:
          TEST_DATABASE_DSN: "host=localhost port=5432 dbname=weather user=etl password=etl"
        run: pytest -v
